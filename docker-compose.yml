services:
  ui:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - rag_index:/app/chroma_db
      - rag_uploads:/app/uploaded_docs
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - rag_index:/app/chroma_db
      - rag_uploads:/app/uploaded_docs
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  rag_index:
  rag_uploads:
